# Fictional JSON-path portal: a POST search API returning a result array.
name: Example Development Bank
listing_url: https://jobs.example.net/api/search
method: post
body: '{"page": 1, "size": 100}'
json_path: data.results
fields:
  id: jobId
  title: title
  location: location.city
  deadline: closingDate
detail_url: https://jobs.example.net/careers/job/{id}
ats: successfactors
