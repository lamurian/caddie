# United Nations Secretariat careers (careers.un.org). Fixture and tests:
# testdata/portals/un/listing.json, internal/source/portal_un_test.go.
name: United Nations
listing_url: https://careers.un.org/api/public/opening/jo/list/filteredV2/en
method: post
body: >-
  {"filterConfig":{"keyword":""},
  "pagination":{"page":0,"itemPerPage":500,"sortBy":"startDate","sortDirection":-1}}
json_path: data.list
fields:
  id: jobId
  title: postingTitle
  location: dutyStation.0.description
  deadline: endDate
detail_url: https://careers.un.org/jobSearchDescription/{id}?language=en
# endDate is 23:59 New York time sent as UTC: convert it (ADR 0029).
deadline_tz: America/New_York
ats: inspira
notes: >-
  careers.un.org is an Angular SPA; its job list comes from the JSON API in
  listing_url, which this config calls directly, so no JavaScript is needed.
  Applications go through Inspira (inspira.un.org, login required), so
  applying ends in the manual checklist.
  VERIFIED first-hand 2026-11-03 (through a web-fetch service outside
  this project's network): GET /api/public/opening/jo/<id>/en returns data.jobId,
  postingTitle ("..., D1"), dutyStation [{code, description: "GENEVA"}] and
  endDate "2026-11-14T04:59:59.000Z" for a job the RSS feed shows closing
  "11/13/2026 23:59:59 PM (New York time)"; hence deadline_tz. That GET
  also bumps the job's view count, so caddie never calls it.
  VERIFIED third-party 2026-11-03 (three open-source scrapers call this
  POST): the request body shape, data.list, and list items with jobId,
  postingTitle, dutyStation[].description, endDate and totalCount.
  ASSUMED (not seen first-hand: careers.un.org answers this project's
  datacenter with a CloudFront 403 on every path, and a POST cannot be sent
  any other way here): that the live list matches, and that itemPerPage 500
  is honoured (those scrapers page at 50 or 100). If search returns a
  json_path or empty-title error, record a real response and fix these keys.
  itemPerPage 500 aims to cover every opening (about 465 in 2026-10) in one
  request; there is no paging, so a server cap would cut the list short.
  Limitations: location is the first duty station only, in capitals
  (dutyStation is an array of objects, which a dotted path cannot join).
  jobLevel is a grade (P-3), not a salary, so it is not mapped.
  Alternative: the public RSS feed https://careers.un.org/jobfeed lists
  every opening, but its dates are MM/DD/YYYY, which caddie ignores as
  ambiguous. robots.txt is not a real file (the SPA answers it), so there
  is no Disallow; no terms of use for automated access were found.
