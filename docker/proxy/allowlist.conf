# Egress allowlist for the browser (ADR 0002, PRD §9). tinyproxy matches
# each line, an anchored POSIX extended regex, against the request's host.
# Escape dots; anchor both ends. Exact host: ^jobs\.lever\.co$
# Host and subdomains (*.example.org): (^|\.)example\.org$
# One host per line, with a comment naming the ATS or organisation.

^boards\.greenhouse\.io$            # Greenhouse (classic boards)
^job-boards\.greenhouse\.io$        # Greenhouse (new boards)
^jobs\.lever\.co$                   # Lever
^jobs\.ashbyhq\.com$                # Ashby
(^|\.)myworkdayjobs\.com$           # Workday (*.myworkdayjobs.com)
(^|\.)smartrecruiters\.com$         # SmartRecruiters (*.smartrecruiters.com)
^careers\.who\.int$                 # World Health Organization (Taleo), portals/who.yml
^careers\.un\.org$                  # United Nations careers, portals/un.yml
^inspira\.un\.org$                  # United Nations Inspira (applications, login)
^worldbankgroup\.csod\.com$         # World Bank Group (Cornerstone OnDemand)
^www\.adb\.org$                     # Asian Development Bank
^www\.isdb\.org$                    # Islamic Development Bank
^www\.mckinsey\.com$                # McKinsey & Company
^careers\.bcg\.com$                 # Boston Consulting Group
^www\.bain\.com$                    # Bain & Company
