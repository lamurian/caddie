# tinyproxy 1.11 config for the browser's egress proxy (ADR 0002).
# Only hosts matching a line of allowlist.conf are reachable; every other
# request is refused with 403 Filtered.

Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Notice
DefaultErrorFile "/usr/share/tinyproxy/default.html"

# Clients: the compose networks only (Docker's private ranges).
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Allowlist: each line is an anchored POSIX extended regex matched against
# the host (not the full URL), case-insensitively. Anything unmatched is denied.
Filter "/etc/tinyproxy/allowlist.conf"
FilterType ere
FilterURLs No
FilterDefaultDeny Yes

# HTTPS (CONNECT) only to port 443.
ConnectPort 443
